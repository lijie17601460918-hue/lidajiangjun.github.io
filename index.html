<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字游戏（双模式+多人对战）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .game-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* 模式选择区域 */
        .mode-select {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: white;
            color: #4a5568;
        }

        .mode-btn.active {
            background-color: #4299e1;
            color: white;
            border-color: #4299e1;
        }

        .mode-btn:hover:not(.active) {
            border-color: #cbd5e0;
        }

        /* 对战模式额外样式 */
        .battle-mode-panel {
            background-color: #f0f8fb;
            border: 2px solid #9f7aea;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            display: none;
        }

        .battle-player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 16px;
            color: #2d3748;
        }

        .battle-player span {
            font-weight: bold;
            color: #9f7aea;
        }

        .set-answer-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        #battleAnswerInput {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        #battleAnswerInput:focus {
            border-color: #9f7aea;
            box-shadow: 0 0 0 3px rgba(159, 122, 234, 0.1);
        }

        #confirmAnswerBtn {
            background-color: #9f7aea;
            color: white;
        }

        #confirmAnswerBtn:hover {
            background-color: #805ad5;
            transform: translateY(-1px);
        }

        /* 计时区域 */
        .timer-area {
            text-align: center;
            font-size: 20px;
            color: #e53e3e;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #fef2f2;
            border-radius: 8px;
        }

        /* 规则区域 */
        .rules {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        /* 已知数字提示 */
        .hint-num {
            background-color: #fef7fb;
            border: 2px solid #fcc367;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0 20px;
            text-align: center;
            font-size: 20px;
            color: #ed8936;
            font-weight: bold;
            letter-spacing: 2px;
            display: none; /* 默认隐藏，模式2显示 */
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #guessInput {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        #guessInput:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        /* 按钮通用样式 */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #submitBtn {
            background-color: #38b2ac;
            color: white;
        }

        #submitBtn:hover {
            background-color: #319795;
            transform: translateY(-1px);
        }

        #giveUpBtn {
            background-color: #e53e3e;
            color: white;
        }

        #giveUpBtn:hover {
            background-color: #c53030;
            transform: translateY(-1px);
        }

        #restartBtn {
            background-color: #4299e1;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        #restartBtn:hover {
            background-color: #3182ce;
            transform: translateY(-1px);
        }

        /* 禁用状态 */
        .btn:disabled, .mode-btn:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            transform: none !important;
            border-color: #a0aec0 !important;
        }

        /* 结果提示 */
        .result {
            font-size: 18px;
            margin-bottom: 15px;
            min-height: 24px;
            text-align: center;
        }

        .correct {
            color: #48bb78;
            font-weight: bold;
        }

        .error {
            color: #e53e3e;
        }

        .giveup {
            color: #ed8936;
            font-weight: bold;
        }

        /* 历史记录 */
        .history-title {
            font-size: 16px;
            font-weight: bold;
            color: #2d3748;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-title::before {
            content: "📜";
            font-size: 14px;
        }

        .history-list {
            list-style: none;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 15px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:nth-child(even) {
            background-color: #fafbfc;
        }

        .history-num {
            color: #4a5568;
        }

        .history-correct {
            color: #48bb78;
            font-weight: bold;
            background-color: rgba(72, 187, 120, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>猜数字游戏</h1>

        <!-- 核心模式选择区域 -->
        <div class="mode-select">
            <button class="mode-btn active" id="mode1Btn">模式1：纯随机猜数字</button>
            <button class="mode-btn" id="mode2Btn">模式2：已知数字猜顺序</button>
            <button class="mode-btn" id="battleModeBtn">模式3：双人对战</button>
        </div>

        <!-- 双人对战面板（默认隐藏） -->
        <div class="battle-mode-panel" id="battleModePanel">
            <div class="battle-player" id="battlePlayerTip">
                🎮 当前状态：等待玩家1设置答案
            </div>
            <div class="set-answer-area">
                <input type="text" id="battleAnswerInput" maxlength="4" placeholder="玩家1请输入4位数字作为答案">
                <button class="btn" id="confirmAnswerBtn">确认答案</button>
            </div>
        </div>

        <!-- 计时区域 -->
        <div class="timer-area" id="timerArea">
            耗时：00:00:00
        </div>

        <!-- 游戏规则 -->
        <div class="rules" id="gameRules">
            <p>📌 模式1规则：</p>
            <p>1. 系统随机生成4个0-9的数字（可重复），组成四位数；</p>
            <p>2. 你每次输入4位数字猜测，系统仅反馈「数字+位置都正确」的个数；</p>
            <p>3. 点击「放弃」可直接查看答案，「重新开始」会重置数字并清空记录。</p>
        </div>

        <!-- 已知数字提示（模式2专属） -->
        <div class="hint-num" id="hintNum">正在生成数字...</div>

        <!-- 输入区域 -->
        <div class="input-area">
            <input type="text" id="guessInput" maxlength="4" placeholder="请输入4位数字（如1234）">
            <button class="btn" id="submitBtn">提交猜测</button>
            <button class="btn" id="giveUpBtn">放弃</button>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>

        <!-- 结果提示 -->
        <div class="result" id="result"></div>

        <!-- 历史记录 -->
        <div class="history-title">猜测历史</div>
        <ul class="history-list" id="historyList"></ul>
    </div>

    <script>
        // 全局变量
        let currentMode = 1; // 1=纯随机 2=已知数字 3=双人对战
        let targetNumber = []; // 目标数字（答案，数组形式）
        let targetDigits = []; // 模式2下展示的4个数字（数组形式）
        let guessHistory = []; // 猜测历史：[{guess: '1234', correct: 1}, ...]
        let isGameOver = false; // 游戏是否结束（猜对/放弃）
        
        // 多人对战相关变量
        let isBattleMode = false; // 是否为对战模式
        let battleStep = 1; // 对战步骤：1=玩家1设置答案 2=玩家2猜测
        let battleAnswer = []; // 玩家1设置的对战答案
        
        // 计时相关变量
        let timerInterval = null; // 计时器定时器
        let startTime = 0; // 开始时间戳
        let elapsedTime = 0; // 已耗时（秒）

        // 初始化游戏（根据当前模式生成对应数字）
        function initGame() {
            // 重置基础变量
            guessHistory = [];
            isGameOver = false;
            updateHistory();
            clearResult();
            
            // 恢复按钮和输入框状态
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('giveUpBtn').disabled = false;
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').focus();

            // 停止并重置计时器
            stopTimer();
            elapsedTime = 0;
            updateTimerDisplay();

            // 对战模式初始化
            if (currentMode === 3) {
                isBattleMode = true;
                battleStep = 1;
                document.getElementById('battleModePanel').style.display = 'block';
                document.getElementById('battlePlayerTip').textContent = '🎮 当前状态：等待玩家1设置答案';
                document.getElementById('battleAnswerInput').disabled = false;
                document.getElementById('confirmAnswerBtn').disabled = false;
                document.getElementById('guessInput').disabled = true;
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('hintNum').style.display = 'none';
            } else {
                isBattleMode = false;
                document.getElementById('battleModePanel').style.display = 'none';
                // 非对战模式生成目标数字
                if (currentMode === 1) {
                    // 模式1：纯随机4位数字（可重复）
                    targetNumber = Array.from({length: 4}, () => Math.floor(Math.random() * 10));
                    document.getElementById('hintNum').style.display = 'none';
                } else if (currentMode === 2) {
                    // 模式2：先生成4个数字，再随机排列作为答案
                    targetDigits = Array.from({ length: 4 }, () => Math.floor(Math.random() * 10));
                    targetNumber = [...targetDigits];
                    // Fisher-Yates洗牌算法打乱顺序
                    for (let i = targetNumber.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [targetNumber[i], targetNumber[j]] = [targetNumber[j], targetNumber[i]];
                    }
                    document.getElementById('hintNum').style.display = 'block';
                    document.getElementById('hintNum').textContent = `已知数字：${targetDigits.join(' ')}`;
                }
                // 非对战模式启动计时器
                startTimer();
            }

            // 控制台打印答案（调试用）
            console.log(`当前模式${currentMode}，答案：`, targetNumber.join(''));
        }

        // 切换游戏模式
        function switchMode(mode) {
            currentMode = mode;
            // 更新模式按钮样式
            document.getElementById('mode1Btn').classList.toggle('active', mode === 1);
            document.getElementById('mode2Btn').classList.toggle('active', mode === 2);
            document.getElementById('battleModeBtn').classList.toggle('active', mode === 3);
            // 更新规则说明
            const rulesEl = document.getElementById('gameRules');
            if (mode === 1) {
                rulesEl.innerHTML = `
                    <p>📌 模式1规则：</p>
                    <p>1. 系统随机生成4个0-9的数字（可重复），组成四位数；</p>
                    <p>2. 你每次输入4位数字猜测，系统仅反馈「数字+位置都正确」的个数；</p>
                    <p>3. 点击「放弃」可直接查看答案，「重新开始」会重置数字并清空记录；</p>
                    <p>4. 页面会实时显示你猜测的耗时。</p>
                `;
            } else if (mode === 2) {
                rulesEl.innerHTML = `
                    <p>📌 模式2规则：</p>
                    <p>1. 系统生成4个0-9的数字（可重复），并告知你这4个数字；</p>
                    <p>2. 系统将这4个数字随机组成四位数（隐藏顺序，为正确答案）；</p>
                    <p>3. 你可输入任意4位数字猜测，无需局限于给出的4个；</p>
                    <p>4. 每次猜测后，仅反馈「数字+位置都正确」的个数；</p>
                    <p>5. 点击「放弃」查看正确答案，「重新开始」生成新数字并清空记录；</p>
                    <p>6. 页面会实时显示你猜测的耗时。</p>
                `;
            } else if (mode === 3) {
                rulesEl.innerHTML = `
                    <p>📌 模式3（双人对战）规则：</p>
                    <p>1. 玩家1先输入4位数字作为答案（仅自己可见）；</p>
                    <p>2. 切换至玩家2进行猜测，系统反馈「数字+位置都正确」的个数；</p>
                    <p>3. 玩家2猜对即游戏结束，可查看总耗时和猜测次数；</p>
                    <p>4. 点击「放弃」可直接查看答案，「重新开始」重置对战状态。</p>
                `;
            }
            // 重新初始化游戏
            initGame();
        }

        // 提交猜测处理
        function submitGuess() {
            const input = document.getElementById('guessInput');
            const result = document.getElementById('result');
            const guessValue = input.value.trim();

            // 输入校验
            if (!/^\d{4}$/.test(guessValue)) {
                result.className = 'result error';
                result.textContent = '❌ 请输入4位纯数字！';
                return;
            }

            // 游戏结束后禁止提交
            if (isGameOver) {
                result.className = 'result error';
                result.textContent = '❌ 游戏已结束，请点击重新开始！';
                return;
            }

            // 确定对比的目标数字（对战模式用玩家1设置的答案）
            const compareTarget = isBattleMode ? battleAnswer : targetNumber;
            
            // 对比猜测结果
            const guessArr = guessValue.split('').map(Number);
            let correctCount = 0;
            for (let i = 0; i < 4; i++) {
                if (guessArr[i] === compareTarget[i]) {
                    correctCount++;
                }
            }

            // 记录历史
            guessHistory.push({
                guess: guessValue,
                correct: correctCount
            });
            updateHistory();

            // 结果反馈
            if (correctCount === 4) {
                // 猜对了
                stopTimer();
                const timeStr = formatTime(elapsedTime);
                result.className = 'result correct';
                if (isBattleMode) {
                    result.textContent = `🎉 恭喜玩家2猜对！答案就是${compareTarget.join('')}，共猜了${guessHistory.length}次，总耗时${timeStr}！`;
                } else {
                    result.textContent = `🎉 恭喜猜对！答案就是${compareTarget.join('')}，共猜了${guessHistory.length}次，总耗时${timeStr}！`;
                }
                gameOver();
            } else {
                // 未猜对
                result.className = 'result';
                result.textContent = `ℹ️ 本次猜对${correctCount}个（数字+位置都对），继续加油！`;
            }

            // 清空输入框并聚焦
            input.value = '';
            input.focus();
        }

        // 放弃游戏
        function giveUp() {
            if (isGameOver) return;
            
            stopTimer();
            const result = document.getElementById('result');
            const compareTarget = isBattleMode ? battleAnswer : targetNumber;
            const timeStr = formatTime(elapsedTime);
            
            result.className = 'result giveup';
            if (isBattleMode) {
                result.textContent = `🚫 玩家2选择放弃！正确答案是：${compareTarget.join('')}，总耗时${timeStr}`;
            } else {
                result.textContent = `🚫 你选择放弃！正确答案是：${compareTarget.join('')}，总耗时${timeStr}`;
            }
            gameOver();
        }

        // 游戏结束处理（禁用提交/放弃按钮）
        function gameOver() {
            isGameOver = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('giveUpBtn').disabled = true;
            document.getElementById('guessInput').disabled = true;
            if (isBattleMode) {
                document.getElementById('battleAnswerInput').disabled = true;
                document.getElementById('confirmAnswerBtn').disabled = true;
            }
        }

        // 更新历史记录列表
        function updateHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            guessHistory.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <span class="history-num">第${index+1}次：${item.guess}</span>
                    <span class="history-correct">正确个数：${item.correct}</span>
                `;
                historyList.appendChild(li);
            });

            // 滚动到最新记录
            historyList.scrollTop = historyList.scrollHeight;
        }

        // 清空结果提示
        function clearResult() {
            document.getElementById('result').textContent = '';
        }

        // ********************* 双人对战专属方法 *********************
        // 确认玩家1设置的答案
        function confirmBattleAnswer() {
            const input = document.getElementById('battleAnswerInput');
            const value = input.value.trim();
            const result = document.getElementById('result');

            // 输入校验
            if (!/^\d{4}$/.test(value)) {
                result.className = 'result error';
                result.textContent = '❌ 请输入4位纯数字作为答案！';
                return;
            }

            // 记录玩家1设置的答案
            battleAnswer = value.split('').map(Number);
            battleStep = 2;

            // 更新对战状态提示
            document.getElementById('battlePlayerTip').textContent = '🎮 当前状态：玩家2开始猜测';
            document.getElementById('battleAnswerInput').disabled = true;
            document.getElementById('confirmAnswerBtn').disabled = true;
            document.getElementById('guessInput').disabled = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('guessInput').focus();
            
            // 启动计时器
            startTimer();
            
            // 清空结果提示
            clearResult();
            input.value = '';
        }

        // ********************* 计时功能专属方法 *********************
        // 启动计时器
        function startTimer() {
            stopTimer(); // 先停止已有计时器
            startTime = Date.now() - (elapsedTime * 1000);
            timerInterval = setInterval(() => {
                elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                updateTimerDisplay();
            }, 1000);
        }

        // 停止计时器
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // 格式化时间（秒转 时:分:秒）
        function formatTime(seconds) {
            const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            document.getElementById('timerArea').textContent = `耗时：${formatTime(elapsedTime)}`;
        }

        // 绑定事件
        function bindEvents() {
            // 模式切换事件
            document.getElementById('mode1Btn').addEventListener('click', () => switchMode(1));
            document.getElementById('mode2Btn').addEventListener('click', () => switchMode(2));
            document.getElementById('battleModeBtn').addEventListener('click', () => switchMode(3));
            
            // 提交猜测
            document.getElementById('submitBtn').addEventListener('click', submitGuess);
            
            // 放弃
            document.getElementById('giveUpBtn').addEventListener('click', giveUp);
            
            // 重新开始
            document.getElementById('restartBtn').addEventListener('click', initGame);
            
            // 回车键提交
            document.getElementById('guessInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitGuess();
            });

            // 双人对战 - 确认答案
            document.getElementById('confirmAnswerBtn').addEventListener('click', confirmBattleAnswer);
            
            // 对战答案输入框回车确认
            document.getElementById('battleAnswerInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && battleStep === 1) confirmBattleAnswer();
            });
        }

        // 页面加载完成后初始化
        window.onload = function() {
            initGame();
            bindEvents();
        };
    </script>
</body>
</html>
